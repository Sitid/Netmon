<!--
  Configuración del agente Wazuh para un Controlador de Dominio (Windows Server).
  Ubicación en el DC: C:\Program Files (x86)\ossec-agent\ossec.conf

  Criterio (servidor validado GxP):
    - Sólo LECTURA y reporte. No ejecuta acciones sobre el equipo (active-response OFF).
    - Recolección de eventos de seguridad FILTRADA por EventID (menos ruido, menos red,
      menos peso sobre la retención de 90 días del indexer).
    - Inventario (syscollector) ON  -> alimenta la detección de vulnerabilidades.
    - FIM (syscheck) conservador: sin realtime, escaneo cada 12 h, sin tocar SYSVOL/NTDS.

  Manager: netmon-srv / 10.10.11.59  (mismo segmento LAN que el DC)
-->
<ossec_config>

  <client>
    <server>
      <address>10.10.11.59</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>windows, windows_server</config-profile>
    <notify_time>60</notify_time>
    <time-reconnect>300</time-reconnect>
    <auto_restart>yes</auto_restart>
    <crypto_method>aes</crypto_method>
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>10.10.11.59</manager_address>
      <port>1515</port>
      <!-- agent_name se toma del hostname del DC si se omite -->
    </enrollment>
  </client>

  <!-- ================= Eventos de seguridad (FILTRADOS) ================= -->
  <!-- Autenticación, bloqueos, cambios de cuentas y de grupos privilegiados,
       Kerberos/NTLM y borrado del log de auditoría. -->
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[
        EventID=1102 or
        EventID=4625 or EventID=4740 or EventID=4771 or EventID=4776 or
        EventID=4720 or EventID=4722 or EventID=4723 or EventID=4724 or
        EventID=4725 or EventID=4726 or EventID=4767 or
        EventID=4728 or EventID=4729 or EventID=4732 or EventID=4733 or
        EventID=4756 or EventID=4757 or
        EventID=4738 or EventID=4781 or
        EventID=4672 or EventID=4649 or EventID=4964
      ]</query>
  </localfile>

  <!-- Salud del propio servidor / arranques / errores de servicios. Bajo volumen. -->
  <localfile>
    <location>System</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[Level=1 or Level=2 or (EventID=6005 or EventID=6006 or EventID=6008 or EventID=7045)]</query>
  </localfile>

  <!-- ================= Inventario (vulnerabilidades) ================= -->
  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>6h</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware>
    <os>yes</os>
    <network>yes</network>
    <packages>yes</packages>
    <ports all="no">yes</ports>
    <processes>yes</processes>
    <hotfixes>yes</hotfixes>
  </wodle>

  <!-- ================= FIM conservador ================= -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>   <!-- 12 h -->
    <scan_on_start>yes</scan_on_start>

    <!-- Sin realtime en un DC: evita I/O continuo. -->
    <directories realtime="no" report_changes="no" check_all="yes">%WINDIR%\System32\drivers\etc</directories>
    <directories realtime="no" report_changes="no" check_all="yes">%WINDIR%\System32\GroupPolicy</directories>

    <!-- Registro: claves sensibles de arranque/servicios. -->
    <windows_registry>HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services</windows_registry>
    <windows_registry>HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Run</windows_registry>

    <!-- Nunca escanear SYSVOL ni la base de AD (ruido + I/O). -->
    <ignore>C:\Windows\SYSVOL</ignore>
    <ignore>C:\Windows\NTDS</ignore>

    <skip_nfs>yes</skip_nfs>
  </syscheck>

  <!-- ================= Sin acciones sobre el host ================= -->
  <active-response>
    <disabled>yes</disabled>
  </active-response>

  <!-- Log interno del propio agente -->
  <logging>
    <log_format>plain</log_format>
  </logging>

</ossec_config>

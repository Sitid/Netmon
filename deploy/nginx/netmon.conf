# netmon detrás de nginx: HTTPS en 8443 (el 443 lo usa el panel de Wazuh).
# El 8080 sólo redirige a HTTPS (mantiene vivos los enlaces y kioscos viejos).
# La API (uvicorn) escucha únicamente en 127.0.0.1:8081.

upstream netmon_api {
    server 127.0.0.1:8081;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name _;

    ssl_certificate     /etc/netmon/tls/netmon-fullchain.crt;
    ssl_certificate_key /etc/netmon/tls/netmon.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:netmon:10m;
    ssl_session_timeout 1d;

    # alguien que entra con http:// al puerto 8443 -> a https
    error_page 497 =301 https://$host:8443$request_uri;

    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    location /ws {
        proxy_pass http://netmon_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://netmon_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;   # reportes PDF largos
    }
}

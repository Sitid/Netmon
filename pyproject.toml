# Configuración de herramientas de calidad (auditoría H17). No es un paquete instalable:
# se despliega con tools/deploy.sh y se instala con install.sh + requirements.lock.

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["frontend", "deploy"]

[tool.ruff.lint]
# errores reales: sintaxis, nombres indefinidos, imports sin usar, etc.
select = ["E4", "E7", "E9", "F"]
# estilo preexistente (varias sentencias por línea, variable 'l'): se deja para
# una limpieza aparte, sin mezclarla con correcciones de datos
ignore = ["E702", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
